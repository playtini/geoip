name: test
on:
    workflow_dispatch:
    push: {branches: ['main']}
    pull_request:
concurrency:
    group: ci-${{ github.ref }}-${{ github.head_ref }}
    cancel-in-progress: true
jobs:
    test:
        # Public dependencies only (Packagist), so a GitHub-hosted runner works here
        runs-on: ubuntu-latest
        steps:
            -   name: checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 1

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    # bcmath: ip2location/ip2location-php requires it
                    extensions: bcmath
                    coverage: pcov
                    # assert() lines run (and count as covered), as in `composer test`
                    ini-values: zend.assertions=1

            -   uses: ramsey/composer-install@v3

            -   name: PHPStan
                run: composer stan

            -   name: PHPUnit
                run: vendor/bin/phpunit --coverage-text
